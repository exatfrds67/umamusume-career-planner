version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "exatfreak"
    commit-message:
      prefix: "fix(deps):"
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"
      testing:
        patterns:
          - "pestphp/*"
          - "phpunit/*"
      dev-tools:
        patterns:
          - "larastan/*"
          - "nunomaduro/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "exatfreak"
    commit-message:
      prefix: "fix(deps):"
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Uma Musume Career Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; font-family: 'Nunito', sans-serif; }
    body { background: #F9F5FF; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #C4B5FD; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #7C3AED; }
    @keyframes pulse {
      from { opacity: .4; transform: scale(.85); }
      to   { opacity: 1;  transform: scale(1);   }
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    button:hover { filter: brightness(1.06); }
    textarea, input { font-family: 'Nunito', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/data.jsx"></script>
  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="components/Layout.jsx"></script>
  <script type="text/babel" src="components/Dashboard.jsx"></script>
  <script type="text/babel" src="components/Characters.jsx"></script>
  <script type="text/babel" src="components/CharacterWizard.jsx"></script>
  <script type="text/babel" src="components/Training.jsx"></script>
  <script type="text/babel" src="components/Races.jsx"></script>
  <script type="text/babel" src="components/Skills.jsx"></script>
  <script type="text/babel" src="components/SupportCards.jsx"></script>
  <script type="text/babel" src="components/AIAdvisor.jsx"></script>
  <script type="text/babel" src="components/Onboarding.jsx"></script>
  <script type="text/babel" src="components/Achievements.jsx"></script>
  <script type="text/babel" src="components/Reports.jsx"></script>
  <script type="text/babel" src="components/Collection.jsx"></script>
  <script type="text/babel" src="components/SystemScreens.jsx"></script>
  <script type="text/babel" src="components/OtherScreens.jsx"></script>
  <script type="text/babel" src="components/App.jsx"></script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#0F0A28"/>
      <rect x="0" y="0" width="18" height="56" fill="#150D35"/>
      <circle cx="9" cy="10" r="5" fill="url(#lg)"/>
      <rect x="2" y="20" width="14" height="3" rx="1.5" fill="rgba(232,121,160,0.6)"/>
      <rect x="2" y="26" width="14" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
      <rect x="2" y="32" width="14" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
      <rect x="2" y="38" width="14" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
      <rect x="22" y="4" width="52" height="20" rx="4" fill="white" opacity=".9"/>
      <rect x="26" y="8" width="22" height="3" rx="1.5" fill="#1E1033"/>
      <rect x="26" y="13" width="14" height="2" rx="1" fill="#7C6FAB"/>
      <rect x="22" y="28" width="24" height="24" rx="4" fill="white" opacity=".9"/>
      <rect x="50" y="28" width="24" height="24" rx="4" fill="white" opacity=".9"/>
      <rect x="26" y="32" width="16" height="2" rx="1" fill="#E879A0"/>
      <rect x="26" y="36" width="12" height="2" rx="1" fill="#EDE9FE"/>
      <rect x="26" y="40" width="14" height="2" rx="1" fill="#EDE9FE"/>
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E879A0"/>
          <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
      </defs>
    </svg>
  </template>
</body>
</html>

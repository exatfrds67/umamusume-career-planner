<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline - Umamusume Career Planner</title>

        <!-- Favicons -->
        <link
            rel="icon"
            type="image/png"
            sizes="128x128"
            href="/images/app_logo/uma_musume_race_planner_logo_128.png"
        />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.bunny.net" />
        <link
            href="https://fonts.bunny.net/css?family=inter:400,500,600,700"
            rel="stylesheet"
        />

        <style>
            :root {
                --primary-500: #8b5cf6; /* Violet 500 */
                --primary-600: #7c3aed; /* Violet 600 */
                --primary-700: #6d28d9; /* Violet 700 */
                --gray-50: #f9fafb;
                --gray-100: #f3f4f6;
                --gray-200: #e5e7eb;
                --gray-300: #d1d5db;
                --gray-700: #374151;
                --gray-800: #1f2937;
                --gray-900: #111827;
                --text-main: #111827;
                --text-muted: #374151;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --text-main: #f9fafb;
                    --text-muted: #d1d5db;
                }
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                background-color: var(--gray-50);
                color: var(--text-main);
                overflow: hidden; /* Prevent scrolling if bg covers */
            }

            /* Background Image Container */
            #app-background {
                position: fixed;
                inset: 0;
                z-index: -1;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                /* Fallback gradients if image fails */
                background-image: linear-gradient(
                    135deg,
                    #f3e8ff 0%,
                    #e0e7ff 100%
                );
                transition: opacity 0.5s ease;
            }

            @media (prefers-color-scheme: dark) {
                #app-background {
                    background-image: linear-gradient(
                        135deg,
                        #1e1b4b 0%,
                        #312e81 100%
                    );
                }
            }

            .container {
                max-width: 32rem;
                width: 100%;
                position: relative;
                z-index: 10;
            }

            /* Glassmorphism Card */
            .glass-card {
                background: rgba(255, 255, 255, 0.7);
                -webkit-backdrop-filter: blur(12px);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.5);
                border-radius: 1.5rem;
                padding: 3rem 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                text-align: center;
            }

            @media (prefers-color-scheme: dark) {
                .glass-card {
                    background: rgba(17, 24, 39, 0.7);
                    border-color: rgba(255, 255, 255, 0.1);
                    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                }
            }

            .logo {
                display: block;
                width: 96px;
                height: 96px;
                margin: 0 auto 1.5rem;
                border-radius: 1.5rem;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }

            h1 {
                font-size: 2rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
                letter-spacing: -0.025em;
            }

            p.subtitle {
                font-size: 1.125rem;
                color: var(--text-muted);
                margin-bottom: 2rem;
                line-height: 1.6;
            }

            .status-badge {
                display: inline-flex;
                align-items: center;
                padding: 0.5rem 1rem;
                border-radius: 9999px;
                font-size: 0.875rem;
                font-weight: 600;
                background-color: #fef2f2;
                color: #ef4444;
                border: 1px solid #fee2e2;
                margin-bottom: 1.5rem;
            }

            @media (prefers-color-scheme: dark) {
                .status-badge {
                    background-color: rgba(239, 68, 68, 0.2);
                    color: #fca5a5;
                    border-color: rgba(239, 68, 68, 0.3);
                }
            }

            .status-dot {
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 50%;
                background-color: currentColor;
                margin-right: 0.5rem;
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }

            /* Action Button */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0.875rem 3rem;
                font-size: 1rem;
                font-weight: 600;
                color: white;
                background-color: var(--primary-600);
                border: none;
                border-radius: 0.75rem;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
                text-decoration: none;
                min-width: 200px;
            }

            .btn:hover {
                background-color: var(--primary-700);
                transform: translateY(-2px);
                box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.5);
            }

            .btn:active {
                transform: translateY(0);
            }

            .btn svg {
                width: 1.25rem;
                height: 1.25rem;
                margin-right: 0.5rem;
            }

            .btn.loading {
                opacity: 0.7;
                pointer-events: none;
                cursor: wait;
            }

            .btn.loading svg {
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            /* Tips Section */
            .tips-container {
                margin-top: 2.5rem;
                padding-top: 2rem;
                border-top: 1px solid rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            @media (prefers-color-scheme: dark) {
                .tips-container {
                    border-top-color: rgba(255, 255, 255, 0.1);
                }
            }

            .tips-title {
                font-size: 0.875rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-muted);
                margin-bottom: 1.25rem;
                text-align: center;
                width: 100%;
            }

            .tips-list {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                width: 100%;
            }

            .tip-item {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 0.75rem;
                font-size: 0.9375rem;
                color: var(--text-muted);
            }

            .tip-item svg {
                width: 1.25rem;
                height: 1.25rem;
                margin-right: 0.75rem;
                flex-shrink: 0;
                color: var(--primary-600);
            }

            @media (prefers-color-scheme: dark) {
                .tip-item svg {
                    color: #a78bfa; /* Violet 400 */
                }
            }
        </style>
    </head>
    <body>
        <!-- Background Image Container -->
        <div id="app-background" aria-hidden="true"></div>

        <main class="container">
            <div class="glass-card">
                <img
                    src="/images/app_logo/uma_musume_race_planner_logo_256.png"
                    alt="Logo"
                    class="logo"
                />

                <div class="status-badge">
                    <span class="status-dot"></span>
                    Offline
                </div>

                <h1>Connection Lost</h1>
                <p class="subtitle">
                    Oops! It seems you've lost your internet connection. Please
                    check your network settings.
                </p>

                <button
                    class="btn"
                    id="retryButton"
                    onclick="retryConnection()"
                >
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                        />
                    </svg>
                    Try Again
                </button>

                <div class="tips-container">
                    <div class="tips-title">Troubleshooting Tips</div>
                    <div class="tips-list">
                        <div class="tip-item">
                            <svg
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728m-9.9-2.829a5 5 0 010-7.07m7.072 0a5 5 0 010 7.07M13 12a1 1 0 11-2 0 1 1 0 012 0z"
                                />
                            </svg>
                            Check your Wi-Fi or mobile data connection
                        </div>
                        <div class="tip-item">
                            <svg
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M13 10V3L4 14h7v7l9-11h-7z"
                                />
                            </svg>
                            Move to an area with better signal reception
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script>
            // Set background image based on theme and device, similar to main app
            function setBackground() {
                const bgElement = document.getElementById("app-background");
                const isDesktop = window.innerWidth >= 1024;
                const isDark = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                ).matches;

                let imageUrl = "";
                if (isDark) {
                    imageUrl = isDesktop
                        ? "/images/app_bg/uma_musume_race_planner_bg_dark_1536x1028.png"
                        : "/images/app_bg/uma_musume_race_planner_bg_dark_1028x1536.png";
                } else {
                    imageUrl = isDesktop
                        ? "/images/app_bg/uma_musume_race_planner_bg_light_1536x1028.png"
                        : "/images/app_bg/uma_musume_race_planner_bg_light_1028x1536.png";
                }

                // Try to load the image (it might be in cache)
                const img = new Image();
                img.onload = () => {
                    bgElement.style.backgroundImage = `url('${imageUrl}')`;
                    bgElement.style.opacity = "1";
                };
                img.onerror = () => {
                    // Fallback to gradient (already set in CSS)
                    console.log(
                        "Background image not cached or failed to load",
                    );
                };
                img.src = imageUrl;
            }

            // Retry connection logic
            function retryConnection() {
                const button = document.getElementById("retryButton");
                const svg = button.querySelector("svg");

                // Add loading state
                button.classList.add("loading");
                button.innerHTML = `
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Connecting...
                `;

                if (navigator.onLine) {
                    checkAndReload();
                } else {
                    setTimeout(() => {
                        resetButton(button);
                    }, 1500);
                }
            }

            function checkAndReload() {
                fetch("/", { method: "HEAD", cache: "no-cache" })
                    .then(() => {
                        if (window.location.pathname === "/offline.html") {
                            window.location.href = "/";
                        } else {
                            window.location.reload();
                        }
                    })
                    .catch(() => {
                        resetButton(document.getElementById("retryButton"));
                    });
            }

            function resetButton(button) {
                button.classList.remove("loading");
                button.innerHTML = `
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Try Again
                `;
            }

            // Init
            window.addEventListener("load", setBackground);
            window.addEventListener("resize", setBackground);
            window
                .matchMedia("(prefers-color-scheme: dark)")
                .addEventListener("change", setBackground);

            // Auto-retry if online
            window.addEventListener("online", () => {
                retryConnection();
            });
        </script>
    </body>
</html>
